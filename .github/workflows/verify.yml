name: Comprobar cambios
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:updates
      - run: pnpm test:integrity
      - run: pnpm test:publication
      - run: pnpm test:v43
      - run: pnpm test:sharing
      - run: pnpm test:automatic
      - run: pnpm test:food-display
      - run: pnpm test:ai-statistics
      - run: pnpm test:background
      - run: pnpm test:center
      - run: pnpm test:installed
      - run: pnpm test:responsive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-y-publicacion
          path: |
            dist
            test-results
          retention-days: 14
