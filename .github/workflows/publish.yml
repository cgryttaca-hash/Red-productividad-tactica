name: Publicar versión aprobada
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión que se publicará, por ejemplo 4.0.0
        required: true
        type: string
      approved:
        description: He revisado pruebas y cambios y autorizo publicar este commit
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publicar-eventos
  cancel-in-progress: false
jobs:
  prepare:
    if: inputs.approved == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tools/build-release.cjs --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:updates
      - run: pnpm test:integrity
      - run: pnpm test:publication
      - run: pnpm test:v43
      - run: pnpm test:sharing
      - run: pnpm test:automatic
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefacto verificado
        id: deployment
        uses: actions/deploy-pages@v4
