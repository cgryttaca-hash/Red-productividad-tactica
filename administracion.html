</template><template id="admin-template-assistant"><header class="control-heading"><h2>Asistente inteligente</h2><p>Consultas de lectura, estadísticas y preparación de mensajes con los datos disponibles.</p></header><div class="assistant-quick-actions" role="group" aria-label="Acciones del asistente"><button type="button" data-assistant-quick="summary" data-assistant-period="today">Resumen de hoy</button><button type="button" data-assistant-quick="list" data-assistant-period="keep">Consultar eventos</button><button type="button" data-assistant-quick="issues" data-assistant-period="all">Información incompleta</button><button type="button" data-assistant-quick="duplicates" data-assistant-period="all">Posibles duplicados</button><button type="button" data-assistant-quick="statistics" data-assistant-period="keep">Analizar estadísticas</button><button type="button" data-assistant-quick="whatsapp" data-assistant-period="keep">Preparar mensaje</button></div><section class="assistant-grid"><article class="card"><header class="card-header"><div><span>DATOS DEL SISTEMA</span><h2>Consulta local</h2><p id="assistantSource">Leyendo los datos guardados…</p></div></header><div class="card-body">
<form id="assistantQuery" class="form-grid" data-update-transient>
<label class="field"><span>Desde</span><input id="assistantFrom" type="date"></label><label class="field"><span>Hasta</span><input id="assistantTo" type="date"></label>
<label class="field"><span>Empresa</span><input id="assistantCompany" maxlength="160" placeholder="Todas"></label><label class="field"><span>Salón</span><input id="assistantRoom" maxlength="160" placeholder="Todos"></label>
<label class="field"><span>Estado</span><input id="assistantStatus" maxlength="160" placeholder="Todos, incluso sin estado"></label><label class="field"><span>Preparar</span><select id="assistantAction"><option value="statistics">Estadísticas calculadas</option><option value="summary">Resumen operativo</option><option value="list">Lista de eventos</option><option value="issues">Campos por revisar</option><option value="duplicates">Posibles duplicados</option><option value="whatsapp">Mensaje para el equipo</option><option value="minuta">Preparación de minuta</option><option value="configuration">Comprobación de datos</option><option value="suggestions">Sugerencias de operación</option></select></label>
<div class="full tool-actions"><button type="submit" class="btn primary">Consultar datos</button><button id="assistantTomorrow" type="button" class="btn">Mañana</button><button id="assistantAll" type="button" class="btn">Todas las fechas</button></div></form><p class="assistant-note">Esta consulta usa reglas del sistema; no es una respuesta de IA. Los campos faltantes se indican como «Sin dato».</p></div></article>
<article class="card"><header class="card-header"><div><span>INTEGRACIÓN OPCIONAL</span><h2>Interpretar con IA</h2><p id="assistantAIState" role="status">Comprobando configuración…</p></div></header><div class="card-body"><p class="assistant-note">Se envían tu solicitud y los filtros al proveedor de IA. Las filas de eventos se consultan en Firebase y no se envían al modelo. El reporte se construye con los datos publicados.</p>
<label class="field"><span>Tu solicitud</span><textarea id="assistantQuestion" rows="3" maxlength="1200" placeholder="Por ejemplo: revisa los campos vacíos de los eventos de mañana"></textarea></label><button id="assistantAsk" class="btn primary" type="button" disabled>Interpretar solicitud con IA</button>
<details class="assistant-connect"><summary>Conectar identidad Firebase autorizada</summary><form id="assistantLogin" class="form-grid"><label class="field full"><span>Correo</span><input id="assistantEmail" type="email" autocomplete="username" required></label><label class="field full"><span>Contraseña</span><input id="assistantPassword" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Conectar cuenta</button></form><p class="assistant-note">La cuenta debe estar habilitada en el servidor. Tu usuario local mantiene sus permisos actuales.</p></details></div></article></section>
<section class="card assistant-result"><header class="card-header"><div><span id="assistantMode">RESULTADO LOCAL</span><h2 id="assistantTitle">Reporte operativo</h2><p id="assistantSummary" role="status" aria-live="polite">Selecciona los filtros y consulta.</p></div><div class="tool-actions"><button id="assistantCopy" class="btn" type="button" disabled>Copiar reporte</button><button id="assistantDownload" class="btn" type="button" disabled>Descargar texto</button></div></header><div class="card-body"><p id="assistantMessage" class="message info" role="status" hidden></p><textarea id="assistantOutput" class="assistant-output" rows="16" readonly aria-label="Reporte preparado"></textarea><p id="assistantTruncated" class="assistant-note" hidden>Vista previa abreviada. Descarga el texto para obtener el reporte completo.</p></div></section>
