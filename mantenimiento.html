<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Página en actualización</title>
  <link rel="stylesheet" href="css/mantenimiento.css?v=20260801-1600">
</head>
<body>
  <header><strong>GESTIÓN DE EVENTOS</strong><span>Mantenimiento programado</span></header>
  <main>
    <section class="maintenance-card">
      <div class="worker" aria-hidden="true">
        <span class="helmet">⚒</span>
        <span class="person">👷</span>
      </div>
      <span class="kicker">PÁGINA EN ACTUALIZACIÓN</span>
      <h1 id="maintenanceTitle">Estamos realizando mejoras</h1>
      <p id="maintenanceMessage">Esta sección estará disponible nuevamente cuando finalice el temporizador.</p>
      <div class="countdown">
        <div><strong id="hours">00</strong><span>Horas</span></div>
        <b>:</b>
        <div><strong id="minutes">00</strong><span>Minutos</span></div>
        <b>:</b>
        <div><strong id="seconds">00</strong><span>Segundos</span></div>
      </div>
      <div class="progress"><i id="progressBar"></i></div>
      <small id="maintenanceStatus">Comprobando el tiempo restante…</small>
    </section>
  </main>
  <script type="module" src="js/mantenimiento.js?v=20260801-1600"></script>
</body>
</html>
