<!doctype html>
<html lang="es" class="maintenance-pending" data-maintenance-page="agenda_movil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Agenda operativa de eventos en tiempo real.">
  <title>Agenda de eventos</title>
  <style>html.maintenance-pending body{visibility:hidden}</style>
  <script type="module" src="js/maintenance-guard.js?v=20260801-1800"></script>
  <link rel="stylesheet" href="css/agenda-movil.css?v=20260801-1915">
</head>
<body>
  <div class="agenda-app">
    <header class="agenda-header">
      <div class="agenda-topbar">
        <div class="agenda-brand">
          <span>OPERACIÓN EN TIEMPO REAL</span>
          <h1>Agenda de eventos</h1>
          <p>Vista operativa clara para consultar salones y servicios.</p>
        </div>
        <div class="agenda-live">
          <div class="connection-card">
            <i id="mobileConnectionDot"></i>
            <div>
              <strong id="mobileConnectionText">Conectando…</strong>
              <span id="mobileUpdatedAt">Esperando actualización</span>
            </div>
          </div>
          <button id="mobileRefresh" class="agenda-refresh" type="button" aria-label="Actualizar agenda" title="Actualizar agenda">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 9a7 7 0 0 1 11.4-2L20 9M4 15l2.5 2a7 7 0 0 0 11.4-2"/></svg>
            <span>Actualizar</span>
          </button>
        </div>
      </div>
    </header>

    <main class="agenda-main">
      <section class="agenda-toolbar" aria-label="Filtros de la agenda">
        <div class="agenda-tabs" role="group" aria-label="Periodo">
          <button class="agenda-tab is-active" type="button" data-view="today">Hoy</button>
          <button class="agenda-tab" type="button" data-view="upcoming">Próximos</button>
          <button class="agenda-tab" type="button" data-view="all">Todos</button>
        </div>
        <label class="agenda-search">
          <span>Buscar</span>
          <input id="mobileSearch" type="search" placeholder="Buscar empresa o salón">
        </label>
        <label class="agenda-date-filter">
          <span>Fecha</span>
          <input id="mobileDateFilter" type="date">
        </label>
      </section>

      <section id="mobileNotice" class="agenda-notice" hidden></section>
      <section id="mobileAgenda" class="agenda-content" aria-live="polite"></section>
    </main>
  </div>

  <div id="mobileDetailModal" class="detail-modal" aria-hidden="true">
    <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="mobileDetailTitle">
      <button id="mobileCloseDetail" class="detail-close" type="button" aria-label="Cerrar">×</button>
      <div class="detail-heading">
        <span>DETALLE OPERATIVO</span>
        <h2 id="mobileDetailTitle">Evento</h2>
        <p id="mobileDetailSubtitle"></p>
      </div>
      <div id="mobileDetailBody" class="detail-body"></div>
    </div>
  </div>

  <script type="module" src="js/agenda-movil.js?v=20260801-1915"></script>
</body>
</html>
