<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142a49">
  <meta name="robots" content="noindex,nofollow">
  <title>Agenda móvil de eventos</title>
  <link rel="stylesheet" href="css/agenda-movil.css?v=20260730-firebase1">
</head>
<body>
  <div class="mobile-app">
    <header class="mobile-header">
      <div class="mobile-header-inner">
        <div class="brand-row">
          <div class="mobile-brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm-2 5h18M8 3v4m8-4v4M7 12h4m3 0h3m-10 4h4m3 0h3"/></svg>
            </span>
            <div class="brand-copy">
              <small>Consulta de solo lectura</small>
              <h1>Agenda de eventos</h1>
            </div>
          </div>
          <div id="liveStatus" class="live-status is-loading"><i></i><span id="liveStatusText">Conectando</span></div>
        </div>
        <div class="date-context">
          <div class="date-context-copy"><small>Fecha actual</small><strong id="todayLabel">—</strong></div>
          <div id="lastPublished" class="update-copy">Sin publicación registrada</div>
        </div>
      </div>
    </header>

    <main class="mobile-main">
      <nav class="view-tabs" aria-label="Vista de eventos">
        <button class="view-tab is-active" type="button" data-mode="today">Hoy</button>
        <button class="view-tab" type="button" data-mode="upcoming">Próximos</button>
        <button class="view-tab" type="button" data-mode="all">Todos</button>
      </nav>

      <section class="mobile-filters" aria-label="Filtros de consulta">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="searchInput" type="search" placeholder="Buscar empresa o escenario" autocomplete="off">
        </label>
        <select id="floorFilter" aria-label="Filtrar por piso"><option value="">Todos los espacios</option></select>
        <input id="dateFilter" type="date" aria-label="Filtrar por fecha">
      </section>

      <div class="mobile-summary">
        <strong id="eventsContext">Programación de hoy</strong>
        <span id="eventsCount">0 eventos</span>
      </div>

      <section id="eventsList" class="events-list" aria-live="polite">
        <div class="empty-state"><strong>Cargando agenda</strong><p>La información se actualizará automáticamente.</p></div>
      </section>
    </main>
  </div>

  <div id="detailModal" class="detail-modal" aria-hidden="true">
    <article class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <header class="detail-header">
        <div class="detail-header-copy">
          <small>Detalle del evento</small>
          <h2 id="detailTitle">Empresa</h2>
          <p id="detailSubtitle">—</p>
        </div>
        <button id="detailClose" class="detail-close" type="button" aria-label="Cerrar">×</button>
      </header>
      <div class="detail-body">
        <section id="detailHighlights" class="detail-highlight"></section>
        <section id="detailRows" class="detail-list"></section>
      </div>
    </article>
  </div>

  <script type="module" src="js/agenda-movil-firebase.js?v=20260730-firebase1"></script>
</body>
</html>
