<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24344d">
  <meta name="description" content="Agenda móvil operativa de eventos en tiempo real.">
  <title>Agenda móvil de eventos</title>
  <link rel="stylesheet" href="css/agenda-movil.css?v=20260801-0100">
</head>
<body>
  <div class="mobile-app">
    <header class="mobile-header">
      <div class="mobile-header-main">
        <div>
          <span class="mobile-eyebrow">Operación en tiempo real</span>
          <h1>Agenda de eventos</h1>
          <p id="mobileConnectionText">Conectando con la agenda…</p>
        </div>
        <div class="mobile-today">
          <strong id="mobileTodayDay">--</strong>
          <span id="mobileTodayMonth">---</span>
        </div>
      </div>
      <div class="mobile-meta">
        <span id="mobileUpdatedAt">Esperando actualización</span>
        <span id="mobileEventCount">0 eventos</span>
      </div>
    </header>

    <main class="mobile-main">
      <section class="mobile-controls" aria-label="Controles de agenda">
        <div class="mobile-tabs" role="tablist">
          <button class="mobile-tab is-active" type="button" data-view="today">Hoy</button>
          <button class="mobile-tab" type="button" data-view="upcoming">Próximos</button>
          <button class="mobile-tab" type="button" data-view="all">Todos</button>
        </div>
        <label class="mobile-search">
          <span>Buscar</span>
          <input id="mobileSearch" type="search" placeholder="Empresa, salón o servicio">
        </label>
        <label class="mobile-date-filter">
          <span>Fecha específica</span>
          <input id="mobileDateFilter" type="date">
        </label>
      </section>

      <section id="mobileNotice" class="mobile-notice" hidden></section>
      <section id="mobileAgenda" class="mobile-agenda" aria-live="polite"></section>
    </main>

    <button id="mobileRefresh" class="mobile-refresh" type="button" aria-label="Actualizar agenda">↻</button>
  </div>

  <div id="mobileDetailModal" class="mobile-modal" aria-hidden="true">
    <div class="mobile-dialog" role="dialog" aria-modal="true" aria-labelledby="mobileDetailTitle">
      <button id="mobileCloseDetail" class="mobile-dialog-close" type="button" aria-label="Cerrar">×</button>
      <div class="mobile-dialog-heading">
        <span>Detalle completo del Excel</span>
        <h2 id="mobileDetailTitle">Evento</h2>
        <p id="mobileDetailSubtitle"></p>
      </div>
      <div id="mobileDetailBody" class="mobile-detail-body"></div>
    </div>
  </div>

  <script type="module" src="js/agenda-movil.js?v=20260801-0100"></script>
</body>
</html>
