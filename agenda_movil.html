<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <title>Agenda móvil de Eventos</title>
  <link rel="stylesheet" href="css/agenda-movil.css?v=20260801-index3">
</head>
<body>
  <header class="mobile-header">
    <div class="mobile-brand"><span>EV</span><div><small>Consulta de solo lectura</small><strong>Agenda de Eventos</strong></div></div>
    <div id="mobileLive" class="live-state"><i></i><span id="mobileLiveText">Conectando</span></div>
  </header>

  <main class="mobile-shell">
    <section class="mobile-intro">
      <div><small id="todayMobileLabel">—</small><h1 id="mobileContext">Eventos de hoy</h1><p id="mobilePublishedAt">Esperando publicación</p></div>
      <strong id="mobileEventCount">0 eventos</strong>
    </section>

    <section class="mobile-controls">
      <div class="mobile-tabs"><button class="is-active" data-mobile-mode="today" type="button">Hoy</button><button data-mobile-mode="upcoming" type="button">Próximos</button></div>
      <label><span>Buscar empresa o salón</span><input id="mobileSearch" type="search" placeholder="Escribe para filtrar"></label>
      <div class="mobile-actions"><button id="notificationButton" type="button">Activar avisos</button><button id="changesToggle" type="button">Cambios recientes</button></div>
    </section>

    <section id="mobileEvents" class="mobile-events" aria-live="polite"></section>
  </main>

  <aside class="changes-panel" aria-label="Historial de cambios">
    <header><div><small>Actividad en tiempo real</small><h2>Cambios recientes</h2></div><button id="changesClose" type="button">×</button></header>
    <div id="mobileChanges" class="mobile-changes"></div>
  </aside>
  <div id="changesBackdrop" class="changes-backdrop"></div>

  <div id="mobileDetail" class="mobile-modal" aria-hidden="true">
    <div class="mobile-dialog" role="dialog" aria-modal="true" aria-labelledby="mobileDetailTitle">
      <header><div><small>Detalle del evento</small><h2 id="mobileDetailTitle">Evento</h2><p id="mobileDetailSubtitle"></p></div><button id="mobileDetailClose" type="button">×</button></header>
      <div id="mobileDetailBody" class="mobile-detail-body"></div>
    </div>
  </div>
  <div id="mobileToastHost" class="mobile-toast-host" aria-live="polite"></div>
  <script type="module" src="js/agenda-movil-firebase.js?v=20260801-index3"></script>
</body>
</html>
