<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f9">
  <meta name="robots" content="noindex,nofollow">
  <title>Agenda móvil de eventos</title>
  <link rel="stylesheet" href="css/agenda-movil.css?v=20260730-ux5">
</head>
<body>
  <header class="mobile-header">
    <div class="mobile-brand">
      <span class="mobile-mark">EV</span>
      <div><small>Consulta operativa</small><strong>Agenda de eventos</strong></div>
    </div>
    <div id="mobileLive" class="mobile-live"><i></i><span id="mobileLiveText">Conectando</span></div>
  </header>

  <main class="mobile-shell">
    <section class="mobile-hero">
      <div><small id="todayMobileLabel">—</small><h1 id="mobileContext">Eventos de hoy</h1><p id="mobilePublishedAt">Sin publicación</p></div>
      <strong id="mobileEventCount">0 eventos</strong>
    </section>

    <section class="mobile-controls">
      <div class="mobile-tabs">
        <button class="is-active" data-mobile-mode="today" type="button">Hoy</button>
        <button data-mobile-mode="upcoming" type="button">Próximos</button>
      </div>
      <label class="mobile-search"><span>Buscar</span><input id="mobileSearch" type="search" placeholder="Empresa o salón"></label>
      <div class="mobile-actions">
        <button id="notificationButton" type="button">Activar notificaciones</button>
        <button id="changesToggle" type="button">Cambios recientes</button>
      </div>
    </section>

    <section id="mobileEvents" class="mobile-events" aria-live="polite"></section>
  </main>

  <aside class="changes-panel" aria-label="Historial de cambios">
    <header><div><small>Actividad en tiempo real</small><h2>Cambios recientes</h2></div><button id="changesClose" type="button" onclick="document.body.classList.remove('show-changes')">×</button></header>
    <div id="mobileChanges" class="mobile-changes"></div>
  </aside>
  <div class="changes-backdrop" onclick="document.body.classList.remove('show-changes')"></div>

  <div id="mobileDetail" class="mobile-modal" aria-hidden="true">
    <div class="mobile-dialog" role="dialog" aria-modal="true" aria-labelledby="mobileDetailTitle">
      <header><div><small>Detalle del evento</small><h2 id="mobileDetailTitle">Evento</h2><p id="mobileDetailSubtitle"></p></div><button id="mobileDetailClose" type="button">×</button></header>
      <div id="mobileDetailBody" class="mobile-detail-body"></div>
    </div>
  </div>

  <script type="module" src="js/agenda-movil-firebase.js?v=20260730-ux5"></script>
</body>
</html>
